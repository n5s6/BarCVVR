{{define "content"}}
<h3>Modification du breuvage</h3>

<br><br>

<div class="row">

  <form action="/drinks/{{.drink.ID}}" accept-charset="UTF-8" method="post">

    {{if .error}}
    <div class="row">
      <div class="col s12 l7">
        <div class="card red darken-4">
          <div class="card-content white-text">
            <span class="card-title">Erreur d'enregistrement:</span>
            <ul>
              <li>{{.error}}</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    {{end}}

    <div class="input-field col s12 l7">
      <label for="drink_name" class="active">Nom</label>
      <input type="text" name="drink[name]" id="drink_name" value="{{.drink.Name}}" />
    </div>

    <div class="input-field col s12 l7">
      <select id="post_drink_type" name="post[drink_type]">
        <option value="1" {{if eq .drink.DrinkType "Soft" }}selected{{else if eq .drink.DrinkType "1" }}selected{{end}}>
          Soft</option>
        <option value="2" {{if eq .drink.DrinkType "Bière Cidre" }}selected{{else if eq .drink.DrinkType "2"
          }}selected{{end}}>Bière Cidre</option>
        <option value="3" {{if eq .drink.DrinkType "Vin" }}selected{{else if eq .drink.DrinkType "3" }}selected{{end}}>
          Vin</option>
        <option value="4" {{if eq .drink.DrinkType "Whisky Pastis Ricard Rhum" }}selected{{else if eq
          .drink.DrinkType "4" }}selected{{end}}>Whisky Pastis Ricard Rhum</option>
      </select>
      <label>Type de Boisson</label>
    </div>

    <div class="input-field col s12 l7">
      <label for="drink_price" class="active" data-error="Ce n'est pas un nombre valide">Prix</label>
      <input type="number" name="drink[price]" id="drink_price" value="{{.drink.Price}}" pattern="-?[0-9]*(\.[0-9]+)?"
        step="0.01" />
    </div>

    <div class="input-field col s12 l7">
      <label for="admin_password">Mot de passe Administrateur</label>
      <input type="password" name="admin_password" id="admin_password" value="" />
    </div>

    <div class="col s12">
      <br>
      <input type="checkbox" name="drk[delete]" id="drk_delete" value="yes" />
      <label for="drk_delete" class="red-text"><b>Supprimer la boisson</b></label>
    </div>

    <div class="col s12 l7">
      <br /><br /><br />
      <button class="btn waves-effect waves-light" type="submit" name="action">Valider
        <i class="material-icons right">send</i>
      </button>
    </div>
  </form>

</div>

<script>
  $(document).ready(function () {
    if (typeof Materialize !== 'undefined') {
      $('select').material_select();
    }
  });
</script>
{{end}}
