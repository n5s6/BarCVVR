{{define "content"}}
<h3>Création d'un nouveau Vélivole</h3>

<br><br>

<div class="row">
  <form action="/users" accept-charset="UTF-8" method="post">
    {{if .error}}
    <div class="row">
      <div class="col s12 l7">
        <div class="card red darken-4">
          <div class="card-content white-text">
            <span class="card-title">Erreur d'enregistrement:</span>
            <ul>
              <li>{{.error}}</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    {{end}}

    <div class="input-field col s12 l7">
      <label for="user_firstName" class="active">Prénom</label>
      <input type="text" name="user[firstName]" id="user_firstName" value="{{.user.FirstName}}" />
    </div>

    <div class="input-field col s12 l7">
      <label for="user_lastName" class="active">Nom</label>
      <input type="text" name="user[lastName]" id="user_lastName" value="{{.user.LastName}}" />
    </div>

    <div class="input-field col s12 l7">
      <label for="user_alias" class="active">Surnom</label>
      <input type="text" name="user[alias]" id="user_alias" value="{{.user.Alias}}" />
    </div>

    <div class="input-field col s12 l7" style="display: none;">
      <label for="user_password_digest" class="active">Mot de passe</label>
      <input type="password" name="user[password_digest]" id="user_password_digest" value="test" />
    </div>

    <div class="input-field col s12 l7">
      <label for="user_initAmount" class="active" data-error="Ce n'est pas un nombre valide">Compte de départ</label>
      <input type="number" name="user[initAmount]" id="user_initAmount" value="{{.user.InitAmount}}"
        pattern="-?[0-9]*(\.[0-9]+)?" step="0.01" />
    </div>

    <div class="input-field col s12 l7">
      <label for="user_email" class="active" data-error="Ce n'est pas une adresse email">Email</label>
      <input type="email" name="user[email]" id="user_email" value="{{.user.Email}}" />
    </div>

    <div class="col s12 l7">
      <br /><br /><br />
      <button class="btn waves-effect waves-light" type="submit" name="action">Valider
        <i class="material-icons right">send</i>
      </button>
    </div>
  </form>
</div>

<script>
  $(document).ready(function () {
    if (typeof Materialize !== 'undefined') {
      $('select').material_select();
    }
  });
</script>
{{end}}
