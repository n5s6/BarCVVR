{{define "content"}}
<h3>Edition de {{.user.FirstName}} {{.user.LastName}}</h3>

<br><br>

<div class="row">
  <form action="/users/{{.user.ID}}" accept-charset="UTF-8" method="post">

    {{if .error}}
    <div class="row">
      <div class="col s12 l7">
        <div class="card red darken-4">
          <div class="card-content white-text">
            <span class="card-title">Erreur d'enregistrement:</span>
            <ul>
              <li>{{.error}}</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    {{end}}

    <div class="input-field col s12 l7">
      <label for="user_firstName" class="active">Prénom</label>
      <input type="text" name="user[firstName]" id="user_firstName" value="{{.user.FirstName}}" />
    </div>

    <div class="input-field col s12 l7">
      <label for="user_lastName" class="active">Nom</label>
      <input type="text" name="user[lastName]" id="user_lastName" value="{{.user.LastName}}" />
    </div>

    <div class="input-field col s12 l7">
      <label for="user_alias" class="active">Surnom</label>
      <input type="text" name="user[alias]" id="user_alias" value="{{.user.Alias}}" />
    </div>

    <div class="input-field col s12 l7" style="display: none;">
      <label for="user_password_digest" class="active">Mot de passe</label>
      <input type="password" name="user[password_digest]" id="user_password_digest" value="test" />
    </div>

    <div class="input-field col s12 l7">
      <label for="user_email" class="active" data-error="Ce n'est pas une adresse email">Email</label>
      <input type="email" name="user[email]" id="user_email" value="{{.user.Email}}" />
    </div>

    <div class="input-field col s12 l7">
      <label for="admin_password">Mot de passe Administrateur</label>
      <input type="password" name="admin_password" id="admin_password" value="" />
    </div>

    <div class="col s12">
      <br>
      <input type="checkbox" name="usr[delete]" id="usr_delete" value="yes" />
      <label for="usr_delete" class="red-text"><b>Supprimer l'utilisateur</b></label>
    </div>

    <!-- Also need to pass initAmount and amount if they are meant to be updated like rails did? Wait, edit view doesn't have amount fields. But in controller update it read them... wait, they might be in the form if it was using strong params. If the original view didn't have them, we won't put them to avoid breaking original behavior. Actually I'll append them hidden just in case to avoid emptying them out in Go's binding if I was using struct binding. But since my handler parses them manually from Form, if not found, they might become 0. I should add hidden fields for them to retain values. -->
    <input type="hidden" name="user[initAmount]" value="{{.user.InitAmount}}" />
    <input type="hidden" name="user[amount]" value="{{.user.Amount}}" />

    <div class="col s12 l7">
      <br /><br /><br />
      <button class="btn waves-effect waves-light" type="submit" name="action">Valider
        <i class="material-icons right">send</i>
      </button>
    </div>
  </form>
</div>

<button class="mdl-button mdl-js-button mdl-js-ripple-effect mdl-button--colored"
  onclick="window.location.href='/users/{{.user.ID}}/lost'" style="display: none;">
  Mot de passe perdu
</button>

<script>
  $(document).ready(function () {
    if (typeof Materialize !== 'undefined') {
      $('select').material_select();
    }
  });
</script>
{{end}}
