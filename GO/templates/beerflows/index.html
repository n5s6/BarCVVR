{{define "content"}}
{{if .notice}}<p id="notice">{{.notice}}</p>{{end}}

<h1>Beerflows</h1>

<table>
  <thead>
    <tr>
      <th>Quantity</th>
      <th>Drink ID</th>
      <th colspan="3"></th>
    </tr>
  </thead>

  <tbody>
    {{range .beerflows}}
    <tr>
      <td>{{.Quantity}}</td>
      <td>{{.DrinkID}}</td>
      <td><a href="/beerflows/{{.ID}}">Show</a></td>
      <td><a href="/beerflows/{{.ID}}/edit">Edit</a></td>
      <td>
        <form action="/beerflows/{{.ID}}/delete" method="POST" style="display:inline;"
          onsubmit="return confirm('Are you sure?');">
          <button type="submit"
            style="background:none;border:none;padding:0;color:blue;text-decoration:underline;cursor:pointer;">Destroy</button>
        </form>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>

<br>

<a href="/beerflows/new">New Beerflow</a>
{{end}}
