---
apiVersion: v1
kind: Secret
metadata:
  name: barcvvr-secrets
  labels:
    app: barcvvr
type: Opaque
stringData:
  # Replace these with your actual production credentials before applying:
  DATABASE_URL: "postgres://user:password@hostname:5432/database"
  ADMIN_PASSWORD: "super_secret_password"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: barcvvr-app
  labels:
    app: barcvvr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: barcvvr
  template:
    metadata:
      labels:
        app: barcvvr
    spec:
      containers:
        - name: barcvvr-backend
          image: nmontes/barcvvr:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: barcvvr-secrets
                  key: DATABASE_URL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: barcvvr-secrets
                  key: ADMIN_PASSWORD
            - name: PORT
              value: "3000"
            - name: GIN_MODE
              value: "release"
          # Liveness and Readiness Probes to ensure the container is routing HTTP
          livenessProbe:
            httpGet:
              path: /users
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /users
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: barcvvr-service
  labels:
    app: barcvvr
spec:
  type: ClusterIP
  selector:
    app: barcvvr
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
