version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: barcvvr_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: barcvvr_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barcvvr_user -d barcvvr_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://barcvvr_user:secretpassword@db:5432/barcvvr_db
      - ADMIN_PASSWORD=supersecret
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
